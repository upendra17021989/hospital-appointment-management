# ============================================
# Hospital Management System - Application Config
# ============================================

spring.application.name=hospital-management

# ============================================
# SUPABASE / PostgreSQL Connection
# Replace with your actual Supabase credentials
# ============================================
spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.glzfifztyeuwcbvsbufn
spring.datasource.password=MtiFj2bZYMHMPSA2
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================
# Server
# ============================================
server.port=8080
server.servlet.context-path=/api

# ============================================
# CORS
# ============================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://hospital-appointment-management-rkf.vercel.app}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# ============================================
# Springdoc / Swagger UI
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================
# Logging
# ============================================
logging.level.com.hospital=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# ============================================
# Email (SMTP) - Gmail example (REQUIRED)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from.name=Hospital Management System
spring.mail.from=hospital@gmail.com

# ============================================
# WhatsApp (Twilio Sandbox) - REQUIRED for WhatsApp send
# ============================================
whatsapp.account.sid=${WHATSAPP_ACCOUNT_SID}
whatsapp.auth.token=${WHATSAPP_AUTH_TOKEN}
whatsapp.from.number=${WHATSAPP_FROM_NUMBER}

sms.account.sid=${SMS_ACCOUNT_SID}
sms.auth.token=${SMS_AUTH_TOKEN}
sms.from.number=${SMS_FROM_NUMBER}

# ============================================
# Stripe Payment Configuration
# ============================================
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.success.url=https://hospital-appointment-management-rkf.vercel.app/payment/success
stripe.cancel.url=https://hospital-appointment-management-rkf.vercel.app/payment/cancel


# ============================================
# Subscription Settings
# ============================================
app.subscription.trial-days=14

# ============================================
# Logging
# ============================================
logging.level.com.hospital=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

