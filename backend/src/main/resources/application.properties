# ============================================
# Hospital Management System - Application Config
# ============================================

spring.application.name=hospital-management
spring.config.import=optional:file:.env[.properties]

# ============================================
# Database
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.jdbc.time_zone=${SPRING_JPA_JDBC_TIME_ZONE:UTC}

# ============================================
# Server
# ============================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api}

# ============================================
# CORS / Security
# ============================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:false}

# ============================================
# Springdoc / Swagger UI
# ============================================
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.operationsSorter=${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER:method}

# ============================================
# Logging
# ============================================
logging.level.com.hospital=${LOGGING_LEVEL_COM_HOSPITAL:DEBUG}
logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:WARN}

# ============================================
# Email (SMTP)
# ============================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.from.name=${SPRING_MAIL_FROM_NAME:Hospital Management System}
spring.mail.from=${SPRING_MAIL_FROM:hospital@gmail.com}

# ============================================
# WhatsApp / SMS
# ============================================
whatsapp.account.sid=${WHATSAPP_ACCOUNT_SID}
whatsapp.auth.token=${WHATSAPP_AUTH_TOKEN}
whatsapp.from.number=${WHATSAPP_FROM_NUMBER}

sms.account.sid=${SMS_ACCOUNT_SID}
sms.auth.token=${SMS_AUTH_TOKEN}
sms.from.number=${SMS_FROM_NUMBER}

# ============================================
# Stripe Payment Configuration
# ============================================
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.success.url=${STRIPE_SUCCESS_URL:https://hospital-appointment-management-rkf.vercel.app/payment/success}
stripe.cancel.url=${STRIPE_CANCEL_URL:https://hospital-appointment-management-rkf.vercel.app/payment/cancel}

# ============================================
# Subscription Settings
# ============================================
app.subscription.trial-days=${APP_SUBSCRIPTION_TRIAL_DAYS:14}

# ============================================
# File Uploads
# ============================================
app.uploads.hospital-documents-dir=${APP_HOSPITAL_DOCUMENTS_DIR:uploads/hospital-documents}
app.uploads.signed-agreements-dir=${APP_SIGNED_AGREEMENTS_DIR:uploads/signed-agreements}
app.uploads.hospital-logos-dir=${APP_HOSPITAL_LOGOS_DIR:uploads/hospital-logos}
app.uploads.hospital-qr-codes-dir=${APP_HOSPITAL_QR_CODES_DIR:uploads/hospital-qr-codes}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:12MB}
